[project]
name = "junctionnow-discord-bot"
version = "0.4.0"
description = "Lightweight JunctionNow Discord feed bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.7.1,<3",
    "feedparser>=6.0,<7",
    "httpx>=0.28,<1",
    "selectolax>=0.4,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
