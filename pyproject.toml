[project]
name = "junctionnow-discord-bot"
version = "0.1.0"
description = "Official JunctionNow Discord bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.6,<3",
    "SQLAlchemy>=2.0,<3",
    "greenlet>=3.1,<4",
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.30,<1",
    "httpx>=0.28,<1",
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "feedparser>=6.0,<7",
    "selectolax>=0.3,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
